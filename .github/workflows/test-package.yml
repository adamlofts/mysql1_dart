name: Dart CI

on:
  # Run on PRs and pushes to the default branch.
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # No schedule: a workflow with a cron trigger is disabled after 60 days of
  # repository inactivity, and that disables every trigger, not just the cron.
  workflow_dispatch:

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  # Check code formatting and static analysis on a single OS (linux)
  # against stable and 3.0.0 (the package's lower bound).
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, 3.0.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        if: always() && steps.install.outcome == 'success'
      - name: Analyze code
        run: dart analyze --fatal-infos
        if: always() && steps.install.outcome == 'success'

  # Run tests on a matrix consisting of two dimensions:
  # 1. OS: ubuntu-latest
  # 2. Release channel: stable, and 3.0.0 (the package's lower bound)
  #
  # The base matrix connects as root with no password. The `include` leg
  # gives it a real password, which nothing else here covers. Full
  # authentication is covered by the unix-socket job below, because it is the
  # only transport the server will accept a cleartext password over.
  test:
    needs: analyze
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        sdk: [stable, 3.0.0]
        timezone: ["UTC", "Asia/Singapore"]
        mysql: ["mysql:5.7", "mysql:8"]
        password: [""]
        include:
          # mysql_native_password with a real password. This works today, and
          # nothing in the base matrix covers a non-empty password at all.
          - os: ubuntu-latest
            sdk: stable
            timezone: "UTC"
            mysql: "mysql:5.7"
            password: "s3cret"
    steps:
      - name: Set Timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: ${{ matrix.timezone }}
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Run VM tests
        run: dart test --platform vm
        if: always() && steps.install.outcome == 'success'
        env:
          MYSQL_PASSWORD: ${{ matrix.password }}

    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          # Both are set on purpose. The entrypoint treats an empty
          # MYSQL_ROOT_PASSWORD as unset, so the empty legs fall back to
          # MYSQL_ALLOW_EMPTY_PASSWORD and the password legs get a root
          # password. `mysqladmin ping` still reports the server as alive
          # when it denies access, so the health check works either way.
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_PASSWORD: ${{ matrix.password }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

  # Authentication over a unix socket.
  #
  # The first connection by an account the server has not cached asks for full
  # authentication, and the server only accepts a cleartext password over a
  # connection nobody else can read - so a unix socket is the only way to
  # cover that exchange, and the fast auth which follows it, without
  # implementing the RSA alternative.
  #
  # The server runs as a step rather than as a service because the directory
  # the socket goes in has to exist, and be writable by the server, before the
  # server starts. Service containers are created before any step runs.
  unix-socket:
    needs: analyze
    runs-on: ubuntu-latest
    env:
      SOCKET_DIR: /tmp/mysql-socket
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: stable
      - name: Start MySQL on a unix socket
        run: |
          mkdir -p "$SOCKET_DIR"
          chmod 777 "$SOCKET_DIR"
          docker run -d --name mysql-socket \
            -e MYSQL_ROOT_PASSWORD=s3cret \
            -e MYSQL_DATABASE=testdb \
            -v "$SOCKET_DIR":/var/run/mysqld \
            mysql:8
          for i in $(seq 60); do
            if [ -S "$SOCKET_DIR/mysqld.sock" ] && \
               docker exec mysql-socket mysqladmin ping -uroot -ps3cret --silent >/dev/null 2>&1; then
              echo "server ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "server did not come up"
          docker logs mysql-socket
          exit 1
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Run VM tests
        run: dart test --platform vm
        if: always() && steps.install.outcome == 'success'
        env:
          MYSQL_SOCKET: /tmp/mysql-socket/mysqld.sock
          MYSQL_USER: root
          MYSQL_PASSWORD: s3cret
          MYSQL_DATABASE: testdb

  # A server which refuses any connection that is not over TLS, and one which
  # cannot do TLS at all.
  #
  # The whole suite runs over TLS, with the server's certificate checked: it
  # is the one in test/unit/tls, which is for localhost and 127.0.0.1, and the
  # tests trust it and nothing else. root has a password, so this is also
  # full authentication for caching_sha2_password over TCP - the server will
  # take the password in the clear inside TLS.
  #
  # The server runs as a step rather than as a service because it needs
  # arguments and the certificate, and a service container can be given
  # neither: it starts before the checkout.
  tls:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: stable
      - name: Start MySQL requiring TLS
        run: |
          # The server runs as its own user and has to be able to read the key.
          chmod 644 test/unit/tls/server_key.pem
          docker run -d --name mysql-tls \
            -e MYSQL_ROOT_PASSWORD=s3cret \
            -e MYSQL_DATABASE=testdb \
            -p 3306:3306 \
            -v "$PWD/test/unit/tls":/certs:ro \
            mysql:8 \
            --require-secure-transport=ON \
            --ssl-cert=/certs/server_cert.pem \
            --ssl-key=/certs/server_key.pem \
            --ssl-ca=/certs/server_cert.pem
          # The entrypoint starts a temporary server to set up, stops it and
          # starts the real one. Only the real one listens on TCP.
          for i in $(seq 60); do
            if docker exec mysql-tls mysqladmin ping -h127.0.0.1 -uroot -ps3cret --silent >/dev/null 2>&1; then
              echo "server ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "server did not come up"
          docker logs mysql-tls
          exit 1
      # A second server, with TLS turned off, for the one test which checks
      # that asking for TLS does not settle for a connection without it.
      # Nothing logs in to it, so all it has to do is answer.
      - name: Start MySQL without TLS
        run: |
          docker run -d --name mysql-no-tls \
            -e MYSQL_ROOT_PASSWORD=s3cret \
            -p 3307:3306 \
            mysql:8 \
            --tls-version=
          # The entrypoint's temporary server is ready on port 0. The real one
          # says 3306.
          for i in $(seq 60); do
            if docker logs mysql-no-tls 2>&1 | grep -q "ready for connections.*port: 3306"; then
              echo "server ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "server did not come up"
          docker logs mysql-no-tls
          exit 1
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Run VM tests
        run: dart test --platform vm
        if: always() && steps.install.outcome == 'success'
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_USER: root
          MYSQL_PASSWORD: s3cret
          MYSQL_DATABASE: testdb
          MYSQL_SSL_CA: test/unit/tls/server_cert.pem
          MYSQL_NO_TLS_PORT: 3307
