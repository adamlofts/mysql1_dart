name: Dart CI

on:
  # Run on PRs and pushes to the default branch.
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # No schedule: a workflow with a cron trigger is disabled after 60 days of
  # repository inactivity, and that disables every trigger, not just the cron.
  workflow_dispatch:

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  # Check code formatting and static analysis on a single OS (linux)
  # against stable and 3.0.0 (the package's lower bound).
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, 3.0.0]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
        if: always() && steps.install.outcome == 'success'
      - name: Analyze code
        run: dart analyze --fatal-infos
        if: always() && steps.install.outcome == 'success'

  # Run tests on a matrix consisting of two dimensions:
  # 1. OS: ubuntu-latest
  # 2. Release channel: stable, and 3.0.0 (the package's lower bound)
  #
  # The base matrix connects as root with no password, which is the only case
  # the driver's authentication has ever been exercised against. The two
  # `include` legs give it a real password - see the comments on each.
  test:
    needs: analyze
    runs-on: ${{ matrix.os }}
    # A hyphenated key cannot be read back from `matrix` - the expression
    # parser treats the hyphens as subtraction - hence the separate name.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        sdk: [stable, 3.0.0]
        timezone: ["UTC", "Asia/Singapore"]
        mysql: ["mysql:5.7", "mysql:8"]
        password: [""]
        include:
          # mysql_native_password with a real password. This works today, and
          # nothing in the base matrix covers a non-empty password at all.
          - os: ubuntu-latest
            sdk: stable
            timezone: "UTC"
            mysql: "mysql:5.7"
            password: "s3cret"
          # The one authentication case still not supported, kept visible.
          #
          # MySQL 8 defaults to caching_sha2_password, and the first time an
          # account with a password connects the server has nothing cached, so
          # it asks for full authentication. Answering that on a connection a
          # third party could read means encrypting the password with the
          # server's RSA public key, which this driver cannot do - it reports
          # what to do instead, and test/integration/auth_test.dart asserts
          # that message.
          #
          # So this leg cannot connect at all and every test in it fails. It
          # is allowed to, rather than holding up the rest: drop
          # `experimental` to make it blocking, and delete the leg once
          # full authentication works.
          - os: ubuntu-latest
            sdk: stable
            timezone: "UTC"
            mysql: "mysql:8"
            password: "s3cret"
            experimental: true
    steps:
      - name: Set Timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: ${{ matrix.timezone }}
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: ${{ matrix.sdk }}
      - id: install
        name: Install dependencies
        run: dart pub get
      - name: Run VM tests
        run: dart test --platform vm
        if: always() && steps.install.outcome == 'success'
        env:
          MYSQL_PASSWORD: ${{ matrix.password }}

    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          # Both are set on purpose. The entrypoint treats an empty
          # MYSQL_ROOT_PASSWORD as unset, so the empty legs fall back to
          # MYSQL_ALLOW_EMPTY_PASSWORD and the password legs get a root
          # password. `mysqladmin ping` still reports the server as alive
          # when it denies access, so the health check works either way.
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_PASSWORD: ${{ matrix.password }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
