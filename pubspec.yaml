name: mysql1
version: 0.21.1
description: A library for connecting to and querying MySQL & MariaDB databases.
homepage: https://github.com/adamlofts/mysql1_dart

environment:
  sdk: "^3.0.0"

dependencies:
  collection: ^1.15.0
  crypto: ^3.0.0
  logging: ^1.0.1
  pool: ^1.5.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.16.5

# The key of the certificate the TLS tests present. It protects nothing.
false_secrets:
  - /test/unit/tls/test_server_key_intentionally_public.pem
